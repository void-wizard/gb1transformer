[project]
name = "protein-evolution-agent"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "accelerate==1.15.0",
    "datasets==4.8.5",
    "fastapi==0.162.0",
    "gradio>=6.17.3",
    "langchain>=1.4.7",
    "langchain-deepseek>=1.1.1",
    "langchain-mcp-adapters==0.2.2",
    "langgraph>=1.2.18",
    "matplotlib>=3.11.2",
    "mcp==1.30.0",
    "networkx==3.6.1",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "python-dotenv>=1.2.4",
    "reportlab>=5.1.0",
    "requests>=2.28.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "torch==2.6.0+cu124",
    "transformers>=4.48,<5",
    "uvicorn==0.54.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pypdf>=6.21.4",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402"]
